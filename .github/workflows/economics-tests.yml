name: Regular economics pricing checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  economics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pypdf
      - run: python -m unittest discover -s tests -p test_nymex_economics.py -v
