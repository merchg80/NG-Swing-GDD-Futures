name: ICE Historical Pricing Dashboard

on:
  workflow_dispatch:
    inputs:
      ice_codes:
        description: "ICE codes separated by commas. Leave blank for every code."
        required: false
        default: "FQH,UCS,WAH,NTO,TGB,DOM,H,FQT,TPH,HXS"
        type: string

permissions:
  contents: read

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dashboard dependencies
        run: python -m pip install pandas openpyxl plotly

      - name: Build history database and dashboard
        env:
          ICE_CODES: ${{ inputs.ice_codes }}
        run: python ice_history/build_dashboard.py

      - name: Upload dashboard and database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ICE-History-Dashboard
          path: ice_history_output/
          if-no-files-found: warn
          retention-days: 30
