name: Prepare ICE Pricing Archive

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "input/**"
      - "ice_history/prepare_archive.py"
      - ".github/workflows/prepare-ice-archive.yml"

permissions:
  contents: write

concurrency:
  group: prepare-ice-archive
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out latest main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install conversion dependencies
        run: >
          python -m pip install
          "pandas>=2.2,<3"
          "openpyxl>=3.1,<4"
          "pyarrow>=18,<24"
          "duckdb>=1.2,<2"

      - name: Convert new and changed settlement files
        run: python ice_history/prepare_archive.py

      - name: Commit prepared pricing archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ice_archive/
          if git diff --cached --quiet; then
            echo "Archive is already current."
          else
            git commit -m "Update prepared ICE pricing archive"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
